crawler:
  base_pdf_path: "{TEST_DATA_DIR}/pdfs"
  base_text_path: "{TEST_DATA_DIR}/text"
  base_ocr_path: "{TEST_DATA_DIR}/ocr"
  sqlite_db_path: "{TEST_DATA_DIR}/db/cataloguesearch.db"
  bookmark_extractor_llm: "gemini"
  ocr_engine: "tesseract"
  tessdata_dir: "{BASE_DIR}/tessdata"

index:
  opensearch_config: "{TEST_DATA_DIR}/configs/opensearch-config.yaml"
  chunking_algos:
    default:
      chunk_size: 500
      chunk_overlap: 50
    dynamic:
      similarity_threshold: 0.5
  chunk_strategy: "advanced"

search:
  filtered_metadata_fields: ["type", "category", "language", "Author", "Anuyog", "Name"]
  active_categories: ["Pravachan", "Granth"]

opensearch:
  host: localhost
  port: 19200
  username: admin
  password: Admin@Password123!
  index_name: cataloguesearch_pytest
  metadata_index_name: cataloguesearch_pytest_metadata

vector_embeddings:
  embedding_model: BAAI/bge-m3
  reranking_model: BAAI/bge-reranker-base
  # Supported types: base, fp16, quantized_8bit
  reranker_onnx_path: "{BASE_DIR}/models/bge-reranker-base-onnx"
  embedding_model_type: fp16
