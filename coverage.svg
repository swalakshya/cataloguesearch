<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="20" role="img" aria-label="coverage: 85%">
    <title>coverage: 85%</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="104" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)">
        <rect width="61" height="20" fill="#555"/>
        <rect x="61" width="43" height="20" fill="#44cc11"/>
        <rect width="104" height="20" fill="url(#s)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
        <text x="315" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="510" lengthAdjust="spacing">coverage</text>
        <text x="315" y="140" transform="scale(.1)" textLength="510" lengthAdjust="spacing">coverage</text>
        <text x="815" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="330" lengthAdjust="spacing">85%</text>
        <text x="815" y="140" transform="scale(.1)" textLength="330" lengthAdjust="spacing">85%</text>
    </g>
</svg>
