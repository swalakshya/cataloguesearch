[pytest]
markers =
    integration: marks tests requiring a live API server

filterwarnings =
    ignore:builtin type SwigPy:DeprecationWarning
    ignore:Type google\._upb:DeprecationWarning
    ignore:HTTP_422_UNPROCESSABLE_ENTITY:DeprecationWarning
    ignore:pkgutil\.find_loader:DeprecationWarning
    ignore:resume_download:FutureWarning
    ignore:Using extra keyword arguments on `Field`:DeprecationWarning
    ignore:websockets\.legacy:DeprecationWarning
    ignore:websockets\.server\.WebSocketServerProtocol:DeprecationWarning

# Enable live logging to console
log_cli = true

# Set log level to show VERBOSE logs (level 15)
log_cli_level = 15

# Format for console logs
log_cli_format = [%(asctime)s %(levelname)s - %(filename)s:%(funcName)s : %(lineno)d] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Optionally, also configure captured logs (shown on test failure)
log_level = 15
log_format = [%(asctime)s %(levelname)s - %(filename)s:%(funcName)s : %(lineno)d] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S